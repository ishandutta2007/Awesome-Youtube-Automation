<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090a0f" />
    </linearGradient>

    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF0033">
        <animate attributeName="stop-color" values="#FF0033;#FF007F;#8B5CF6;#FF0033" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#FF3366">
        <animate attributeName="stop-color" values="#FF3366;#6366F1;#06B6D4;#FF3366" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#6366F1">
        <animate attributeName="stop-color" values="#6366F1;#FF0033;#FF007F;#6366F1" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.8" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF0033" stop-opacity="0.18">
        <animate attributeName="stop-opacity" values="0.18;0.32;0.18" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Patterns -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />
      <circle cx="40" cy="40" r="1" fill="#ffffff" fill-opacity="0.08" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bgGrad)" />
  <rect width="1200" height="360" fill="url(#grid)" />
  <circle cx="600" cy="180" r="400" fill="url(#centerGlow)" />

  <!-- Dynamic Automation Circuit / Pipeline Lines (Background Animation) -->
  <g opacity="0.45">
    <!-- Animated Path 1 -->
    <path d="M -50 100 Q 300 40 600 120 T 1250 80" fill="none" stroke="url(#primaryGlow)" stroke-width="2" stroke-dasharray="8 12">
      <animate attributeName="stroke-dashoffset" values="100;0" dur="10s" repeatCount="indefinite" />
    </path>

    <!-- Animated Path 2 -->
    <path d="M -50 260 Q 350 320 650 240 T 1250 280" fill="none" stroke="#06B6D4" stroke-width="1.5" stroke-dasharray="6 10" stroke-opacity="0.6">
      <animate attributeName="stroke-dashoffset" values="0;80" dur="12s" repeatCount="indefinite" />
    </path>

    <!-- Moving Signal Nodes -->
    <circle r="4" fill="#FF0055">
      <animateMotion path="M -50 100 Q 300 40 600 120 T 1250 80" dur="10s" repeatCount="indefinite" />
    </circle>
    <circle r="3" fill="#00F0FF">
      <animateMotion path="M -50 260 Q 350 320 650 240 T 1250 280" dur="12s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Floating Dynamic Feature Pills (Offset to Sides so Center Text Stays Clear) -->
  <!-- Left Side Badges -->
  <g filter="url(#shadow)">
    <!-- Pill 1: AI Scripting -->
    <g transform="translate(70, 75)">
      <animateTransform attributeName="transform" type="translate" values="70 75; 70 82; 70 75" dur="5s" repeatCount="indefinite" />
      <rect width="150" height="34" rx="17" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1.2" />
      <circle cx="18" cy="17" r="5" fill="#10B981">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">🤖 AI Scripting</text>
    </g>

    <!-- Pill 2: Auto Video Assembly -->
    <g transform="translate(90, 245)">
      <animateTransform attributeName="transform" type="translate" values="90 245; 90 237; 90 245" dur="6s" repeatCount="indefinite" />
      <rect width="175" height="34" rx="17" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1.2" />
      <circle cx="18" cy="17" r="5" fill="#3B82F6">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite" />
      </circle>
      <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">🎬 Video Assembly</text>
    </g>
  </g>

  <!-- Right Side Badges -->
  <g filter="url(#shadow)">
    <!-- Pill 3: Neural Voiceover -->
    <g transform="translate(960, 75)">
      <animateTransform attributeName="transform" type="translate" values="960 75; 960 68; 960 75" dur="4.5s" repeatCount="indefinite" />
      <rect width="170" height="34" rx="17" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1.2" />
      <circle cx="18" cy="17" r="5" fill="#EC4899">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2.2s" repeatCount="indefinite" />
      </circle>
      <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">🎙️ Neural Voiceover</text>
    </g>

    <!-- Pill 4: Workflow Orchestration -->
    <g transform="translate(930, 245)">
      <animateTransform attributeName="transform" type="translate" values="930 245; 930 252; 930 245" dur="5.5s" repeatCount="indefinite" />
      <rect width="195" height="34" rx="17" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1.2" />
      <circle cx="18" cy="17" r="5" fill="#8B5CF6">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2.8s" repeatCount="indefinite" />
      </circle>
      <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">⚡ Workflow Pipelines</text>
    </g>
  </g>

  <!-- Central Foreground Content (Guaranteed unobstructed, high-contrast, crisp text) -->
  <g id="foreground" filter="url(#shadow)">
    <!-- YouTube Play Icon with Dynamic Pulse Halo -->
    <g transform="translate(600, 80)">
      <!-- Pulsing halo behind play icon -->
      <circle r="36" fill="#FF0033" opacity="0.25">
        <animate attributeName="r" values="32;42;32" dur="3s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.35;0.1;0.35" dur="3s" repeatCount="indefinite" />
      </circle>
      <!-- YouTube rounded badge -->
      <rect x="-34" y="-24" width="68" height="48" rx="14" fill="#FF0000" />
      <!-- Play triangle -->
      <polygon points="-8,-12 16,0 -8,12" fill="#FFFFFF" />
    </g>

    <!-- Main Title -->
    <text x="600" y="180" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-1" fill="#FFFFFF">
      AWESOME YOUTUBE AUTOMATION
    </text>

    <!-- Subtitle Bar / Capsule -->
    <g transform="translate(600, 215)">
      <text x="0" y="0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#94a3b8" letter-spacing="0.5">
        Top SaaS Platforms &amp; Open-Source Projects for Faceless Channels, Video AI &amp; Orchestration
      </text>
    </g>

    <!-- Feature Tags Row below subtitle -->
    <g transform="translate(600, 255)">
      <text x="0" y="0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#38BDF8" letter-spacing="1.5">
        CONTENT RESEARCH • SCRIPTING • VOICE SYNTHESIS • EDITING • REELS &amp; SHORTS • AUTO-PUBLISHING
      </text>
    </g>

    <!-- Bottom Accent Border Glow Line -->
    <rect x="250" y="320" width="700" height="3" rx="1.5" fill="url(#primaryGlow)" />
  </g>
</svg>
